<head>
    <meta charset="utf-8">

    <title>Lista de Usuario</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sidebars/">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="../menu.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
    <script src="../sidebars.js"></script>
    <script src="../assets/js/color-modes.js"></script>
    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
            transition: box-shadow 0.3s ease-in-out;
        }

        .container:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h4 {
            font-size: 28px;
            color: #333;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .input-group {
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .input-group input {
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #ddd;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .input-group button {
            border-radius: 30px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            padding: 12px 25px;
            border: none;
            transition: background-color 0.3s, transform 0.3s;
        }

        .input-group button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .table {
            background-color: #ffffff;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table th, .table td {
            text-align: center;
            padding: 15px;
            vertical-align: middle;
            font-size: 16px;
        }

        .table th {
            background-color: #007bff;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
        }

        .table tr:nth-child(even) {
            background-color: #f7f7f7;
        }

        .table tr:hover {
            background-color: #f1f1f1;
            transition: background-color 0.3s;
        }

        .table td a {
            color: #007bff;
            font-size: 18px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .table td a:hover {
            color: #0056b3;
            transform: scale(1.1);
        }

        .btn-primary {
            background-color: #28a745;
            border-color: #28a745;
            font-size: 16px;
            padding: 10px 20px;
            transition: background-color 0.3s, transform 0.3s;
        }

        .btn-primary:hover {
            background-color: #218838;
            border-color: #1e7e34;
            transform: scale(1.05);
        }

        .bi {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .bi:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div th:replace="tema_icono :: svg"></div>    

    <div th:replace="tema :: div"></div>

    <div th:replace="iconos :: svg"></div>

    <main class="d-flex flex-nowrap">
        <h1 class="visually-hidden">Sidebars examples</h1>

        <div th:replace="menu :: div"></div>

        <!-- Aquí tendría que ir mi información (Lista, Nuevo, Editar) -->
        <div class="container">
            <h4 class="display-7 mb-4">LISTA DE USUARIOS</h4>
            
            <!-- Formulario de búsqueda -->
            <form action="/usuario/buscar" method="post">
                <div class="input-group mb-4">
                    <input type="text" class="form-control" name="desc" placeholder="Ingrese descripción">
                    <button class="btn btn-outline-secondary" type="submit">Buscar</button>
                </div>
            </form>

            <!-- Tabla de usuarios -->
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Código</th>
                        <th scope="col">Nombres</th>
                        <th scope="col">Apellidos</th>
                        <th scope="col">DNI</th>
                        <th scope="col">Celular</th>
                        <th scope="col">Email</th>
                        <th scope="col">Dirección</th>
                        <th scope="col">User</th>
                        <th scope="col">Editar</th>
                        <th scope="col">Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario,x : ${usuarios}">
                        <th th:text="${x.count}" scope="row"></th>
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.apellido}"></td>
                        <td th:text="${usuario.dni}"></td>
                        <td th:text="${usuario.celular}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.direccion}"></td>
                        <td th:text="${usuario.user}"></td>
                        <td>
                            <a th:href="@{/usuario/editar(cod=${usuario.id})}" target="_self" style="color:green;">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/usuario/eliminar(cod=${usuario.id})}" target="_self" style="color:red;">
                                <i class="bi bi-x-circle-fill"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Botón de agregar -->
            <div class="d-grid gap-2">
                <a th:href="@{/usuario/nuevo}" class="btn btn-primary">Agregar</a>
            </div>
        </div>  
    </main>
</body>
</html>
